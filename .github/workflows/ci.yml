name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        # Mock-mode build: no Supabase / Gemini env required.
        run: npm run build
        env:
          CRON_SECRET: ci-placeholder-secret-not-used-at-build-time-only
